version: '3.8'

services:
  # 1. Database Service
  db:
    image: mysql:8.0
    container_name: museum-db
    restart: always
    environment:
      MYSQL_DATABASE: museum_db
      MYSQL_ROOT_PASSWORD: root_password_anda
      MYSQL_USER: museum_user
      MYSQL_PASSWORD: user_password_anda
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - museum-network

  # 2. PHPMyAdmin Service (Port 80 sesuai screenshot)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: museum-phpmyadmin
    restart: always
    ports:
      - "80:80"
    environment:
      PMA_HOST: db
      PMA_ARBITRARY: 1
    networks:
      - museum-network
    depends_on:
      - db

  # 3. Laravel Application Service (Port 5555 sesuai screenshot)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: museum-app
    restart: always
    ports:
      - "5555:80"
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_URL: https://ta.syahdan.my.id
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: museum_db
      DB_USERNAME: museum_user
      DB_PASSWORD: user_password_anda
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    networks:
      - museum-network
    depends_on:
      - db

networks:
  museum-network:
    driver: bridge

volumes:
  db_data:
